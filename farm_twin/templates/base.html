<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Farm Digital Twin{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">🌾</span>
      <span class="brand-name">Adaptive Digital Twin</span>
    </div>
    <nav class="tabs">
      <a href="{{ url_for('dashboard') }}" class="tab {% if request.path == '/' %}active{% endif %}">Dashboard</a>
      <a href="{{ url_for('twin_page') }}" class="tab {% if request.path == '/twin' %}active{% endif %}">Digital Twin</a>
    </nav>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
